<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic Star-Shaped Domain</title>
</head>
<body>
    <svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
        <!-- Organic star-shaped domain -->
        <path d="M 250 250
                 C 260 180, 280 150, 320 120
                 C 350 100, 380 90, 400 110
                 C 420 130, 430 160, 420 190
                 C 410 220, 400 240, 390 270
                 C 380 300, 380 330, 400 350
                 C 420 370, 450 380, 470 400
                 C 480 420, 475 440, 460 450
                 C 445 460, 420 455, 390 445
                 C 360 435, 340 420, 320 400
                 C 300 380, 285 365, 270 350
                 C 255 335, 245 325, 240 310
                 C 235 295, 235 280, 230 270
                 C 220 250, 200 240, 180 250
                 C 160 260, 150 280, 140 310
                 C 130 340, 120 370, 110 400
                 C 100 430, 90 450, 70 460
                 C 50 470, 30 465, 20 445
                 C 10 425, 15 400, 30 380
                 C 45 360, 65 350, 80 330
                 C 95 310, 100 285, 100 260
                 C 100 235, 95 215, 85 195
                 C 75 175, 60 160, 50 140
                 C 40 120, 40 100, 55 85
                 C 70 70, 95 70, 120 80
                 C 145 90, 165 105, 185 125
                 C 205 145, 220 165, 235 190
                 C 242 205, 246 220, 250 235
                 Z"
              fill="#0D5F8C"
              stroke="#0A4A6B"
              stroke-width="2.5"/>
        
        <!-- Origin point (center) -->
        <circle cx="250" cy="250" r="4" fill="white" stroke="#333" stroke-width="2"/>
        <text x="260" y="248" font-family="Arial, sans-serif" font-size="16" fill="#333" font-weight="bold">O</text>
        
        <!-- Example point x on the boundary -->
        <circle cx="180" cy="380" r="4" fill="white" stroke="#333" stroke-width="2"/>
        <text x="165" y="400" font-family="Arial, sans-serif" font-size="16" fill="#333" font-weight="bold">x</text>
        
        <!-- Line segment from origin to x -->
        <line x1="250" y1="250" x2="180" y2="380" 
              stroke="#333" 
              stroke-width="2.5"
              opacity="0.9"/>
    </svg>
</body>
</html>
